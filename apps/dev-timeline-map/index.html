<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toronto Development Timeline</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="ui">
    <h2>Toronto Development<br>Timeline</h2>

    <div class="control-group">
      <label>Year: <strong id="year-label">2015</strong></label>
      <input type="range" id="year-slider" min="2015" max="2026" value="2015" step="1" />
      <div class="slider-ends">
        <span>2015</span>
        <span>2026</span>
      </div>
    </div>

    <div class="control-group">
      <label>Filter by status:</label>
      <div id="legend">
        <label class="legend-item" data-status="planned">
          <span class="swatch" style="background:#f59e0b"></span>
          <input type="checkbox" checked /> Planned
        </label>
        <label class="legend-item" data-status="approved">
          <span class="swatch" style="background:#3b82f6"></span>
          <input type="checkbox" checked /> Approved
        </label>
        <label class="legend-item" data-status="appealed">
          <span class="swatch" style="background:#a855f7"></span>
          <input type="checkbox" checked /> Appealed
        </label>
        <label class="legend-item" data-status="completed">
          <span class="swatch" style="background:#22c55e"></span>
          <input type="checkbox" checked /> Completed
        </label>
        <label class="legend-item" data-status="refused">
          <span class="swatch" style="background:#ef4444"></span>
          <input type="checkbox" checked /> Refused
        </label>
      </div>
    </div>

    <div id="count-display"></div>
  </div>

  <div id="tooltip"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
  <script src="https://unpkg.com/deck.gl@9.1.0/dist.min.js"></script>
  <script src="asset-config.js"></script>
  <script src="map.js"></script>
</body>
</html>
